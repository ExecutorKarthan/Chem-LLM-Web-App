# =============================================================================
# /etc/nginx/sites-available/chem-llm.conf
#
# Mirrors the pattern from mofinder.conf exactly.
#
# BEFORE ENABLING:
#   1. Replace YOUR_SUBDOMAIN with the subdomain confirmed by WashU IT
#      (e.g. llmexplorer → llmexplorer.chemistry.wustl.edu)
#   2. Generate SSL key and CSR, get cert from WashU IT:
#        sudo openssl genrsa -out /etc/ssl/private/YOUR_SUBDOMAIN.chemistry.wustl.edu.key 2048
#        sudo openssl req -new -sha256 \
#          -key /etc/ssl/private/YOUR_SUBDOMAIN.chemistry.wustl.edu.key \
#          -out /home/zhenglab/YOUR_SUBDOMAIN.chemistry.wustl.edu.csr
#      Then send the .csr file to WashU IT. They will return a .pem certificate.
#      Place it at: /etc/ssl/certs/YOUR_SUBDOMAIN.chemistry.wustl.edu.pem
#   3. Enable this config:
#        sudo ln -s /etc/nginx/sites-available/chem-llm.conf /etc/nginx/sites-enabled/
#        sudo nginx -t
#        sudo systemctl reload nginx
#
# NOTE: Do NOT add another "listen 80" catch-all block — mofinder.conf
# already has one and nginx will reject duplicate catch-alls.
# =============================================================================

server {
    listen 443 ssl;
    server_name YOUR_SUBDOMAIN.chemistry.wustl.edu;

    # SSL certificate from WashU IT
    # !! Replace YOUR_SUBDOMAIN with your real subdomain !!
    ssl_certificate     /etc/ssl/certs/YOUR_SUBDOMAIN.chemistry.wustl.edu.pem;
    ssl_certificate_key /etc/ssl/private/YOUR_SUBDOMAIN.chemistry.wustl.edu.key;

    # Shared TLS and security header snippets — same as MOFinder
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Rate limiting — same zones as MOFinder
    limit_req zone=req_per_ip burst=20 nodelay;
    limit_conn conn_per_ip 20;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Generous timeouts for LLM API calls (Gemini can be slow)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Serve RDKit WASM with correct MIME type so browsers don't reject it
    location = /RDKit_minimal.wasm {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        add_header Content-Type application/wasm;
    }
}
